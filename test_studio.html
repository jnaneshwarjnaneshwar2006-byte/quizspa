<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Avatar Studio Test</title>
  <link rel="stylesheet" href="/assets/css/avatar.css">
  <script src="/assets/js/three.min.js"></script>
  <script src="/assets/js/avatar-engine.js?v=1791218500"></script>
  <script src="/assets/js/avatar-editor.js?v=1791218500"></script>
  <style>
    body { margin: 0; background: #0b0c18; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    .hero-box { text-align: center; background: #13152c; padding: 32px 48px; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; font-size: 24px; color: #f1f2f6; }
    .btn-open { background: linear-gradient(135deg, #6c5ce7, #a55eea); color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 20px rgba(108,92,231,0.4); }
    .btn-open:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,92,231,0.6); }
    #preview-badge { width: 160px; height: 220px; margin: 20px auto; background: #1a1c38; border-radius: 16px; overflow: hidden; position: relative; }
  </style>
</head>
<body>
  <div class="hero-box">
    <h1>QuizSpark Avatar Customizer</h1>
    <div id="preview-badge"></div>
    <button class="btn-open" id="openEditorBtn">Customize 3D Avatar 🎨</button>
  </div>

  <script>
    let currentConfig = AvatarEngine.getDefault('boy');
    let badgeInstance = null;

    function renderBadge() {
      const container = document.getElementById('preview-badge');
      badgeInstance = AvatarEngine.mount(container, currentConfig, {
        mode: 'full',
        animated: true,
        interactive: true
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBadge();

      document.getElementById('openEditorBtn').addEventListener('click', () => {
        AvatarEditor.open({
          initialConfig: currentConfig,
          onSave: (savedCfg) => {
            currentConfig = savedCfg;
            renderBadge();
          }
        });
      });
    });
  </script>
</body>
</html>
